<!DOCTYPE html>
<!--
  ============================================================================
  HSK PARCEL TRACKER - installable mobile app (PWA)
  ============================================================================
  An AfterShip-style tracker: add any tracking number, it auto-detects the
  courier, saves your parcels, and shows a status timeline.

  WORKS OUT OF THE BOX (no backend):
    - tracks numbers listed in tracking_data.json (published by track_parcels.py)
    - auto-detects the courier for any number
    - saves your parcels on the device (localStorage)
    - hands off to the courier's tracking page for live status

  TURN ON LIVE STATUS FOR ANY NUMBER (optional):
    1. Deploy worker/live-track-worker.js to Cloudflare Workers (free) with an
       aggregator API key (Ship24 or TrackingMore free tier).
    2. Put the worker URL in CONFIG.liveApi below.
    Then the app fetches real live status for any number.

  GOOGLE ADS: set CONFIG.adSenseClient + CONFIG.adSlots in the script below.
  ============================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSK Parcel Tracker</title>
<meta name="description" content="Track any parcel - Hrudai Store Kart.">
<meta name="theme-color" content="#0e7c66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HSK Tracker">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --brand:#0e7c66; --brand-dark:#0a5c4c; --brand-soft:#e6f4f0;
    --accent:#f59e0b; --fashion:#db2777; --organic:#16a34a;
    --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --bg:#f2f5f6; --card:#fff;
    --ok:#15803d; --warn:#b45309; --info:#1d4ed8; --err:#b91c1c;
    --r:16px; --sh:0 1px 3px rgba(16,24,40,.07),0 10px 26px -14px rgba(16,24,40,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;
    padding-bottom:78px; /* room for tab bar */
  }
  a{color:inherit}
  .wrap{max-width:640px;margin:0 auto;padding:0 14px}

  /* app bar */
  .appbar{
    position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--brand),var(--brand-dark));
    color:#fff;padding:12px 0;box-shadow:0 2px 10px -4px rgba(0,0,0,.35);
    padding-top:calc(12px + env(safe-area-inset-top));
  }
  .appbar .wrap{display:flex;align-items:center;gap:10px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16.5px;letter-spacing:.2px}
  .logo img{width:30px;height:30px;border-radius:9px}
  .logo .sub{display:block;font-size:11px;font-weight:500;opacity:.85}
  .install-btn{
    margin-left:auto;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.3);
    padding:8px 13px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .install-btn:hover{background:rgba(255,255,255,.28)}
  .install-btn[hidden]{display:none}

  /* search card */
  .search{margin:16px 0 8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--sh);padding:14px}
  .search h1{margin:0 0 3px;font-size:18px}
  .search p{margin:0 0 12px;font-size:13px;color:var(--muted)}
  .field{display:flex;gap:8px;flex-wrap:wrap}
  .field input, .field select{
    padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);font-size:16px;
    font-family:inherit;outline:none;background:#fff;min-width:0;
  }
  .field input{flex:1 1 100%;font-weight:600}
  .field input:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
  .field select{flex:1 1 58%}
  .btn{
    padding:13px 20px;border-radius:12px;border:0;background:var(--brand);color:#fff;font-weight:800;
    font-size:15px;cursor:pointer;font-family:inherit;flex:1 1 34%;
  }
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:var(--brand-soft);color:var(--brand-dark)}
  .note{font-size:12.5px;color:var(--muted);margin:10px 2px 0}
  .note.warn{color:#92400e}

  /* section head */
  .sec{display:flex;align-items:center;gap:8px;margin:20px 2px 8px}
  .sec h2{margin:0;font-size:15px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
  .sec .pill{margin-left:auto;font-size:12px;color:var(--muted)}

  /* shipment cards */
  .cards{display:grid;gap:10px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    box-shadow:var(--sh);display:flex;gap:12px;align-items:center;cursor:pointer;
  }
  .card:active{transform:scale(.995)}
  .card .left{flex:1;min-width:0}
  .card .num{font-weight:800;font-size:15px;word-break:break-all}
  .card .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
  .card .chev{color:#cbd5e1;font-size:20px;flex:0 0 auto}
  .empty{
    background:var(--card);border:1px dashed #cbd5e1;border-radius:14px;padding:28px 18px;text-align:center;
    color:var(--muted);font-size:14px;
  }
  .empty b{color:var(--ink)}

  /* badges */
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;
    border-radius:999px;border:1px solid transparent;white-space:nowrap}
  .badge.ok{background:#dcfce7;color:var(--ok);border-color:#bbf7d0}
  .badge.warn{background:#fef3c7;color:var(--warn);border-color:#fde68a}
  .badge.info{background:#dbeafe;color:var(--info);border-color:#bfdbfe}
  .badge.mute{background:#f1f5f9;color:#475569;border-color:#e2e8f0}
  .badge.err{background:#fee2e2;color:var(--err);border-color:#fecaca}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor}

  /* detail view */
  .back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--brand-dark);
    font-weight:700;font-size:14.5px;font-family:inherit;cursor:pointer;padding:14px 2px}
  .hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
  .hero .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .hero .num{font-weight:800;font-size:17px;word-break:break-all}
  .hero .cour{font-size:13px;color:var(--muted)}
  .hero .upd{font-size:12.5px;color:var(--muted);margin-top:8px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .actions a,.actions button{
    text-decoration:none;font-size:13.5px;font-weight:700;padding:10px 14px;border-radius:11px;border:0;
    background:var(--brand-soft);color:var(--brand-dark);font-family:inherit;cursor:pointer;
  }
  .actions .danger{background:#fee2e2;color:var(--err)}
  .timeline{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--sh);padding:6px 16px}
  .tl{display:flex;gap:14px;padding:12px 0;position:relative}
  .tl:not(:last-child):before{content:"";position:absolute;left:7px;top:28px;bottom:-6px;width:2px;background:var(--line)}
  .tl .dot2{width:16px;height:16px;border-radius:50%;flex:0 0 16px;margin-top:3px;background:#fff;border:3px solid var(--brand)}
  .tl:first-child .dot2{background:var(--brand)}
  .tl .act{font-weight:600;font-size:14.5px}
  .tl .sub{font-size:12.5px;color:var(--muted)}

  /* promos */
  .promo{border-radius:var(--r);padding:20px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh);margin-bottom:12px}
  .promo.fashion{background:linear-gradient(135deg,#db2777,#9d174d)}
  .promo.organic{background:linear-gradient(135deg,#16a34a,#065f46)}
  .promo .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:999px}
  .promo h3{margin:10px 0 5px;font-size:19px}
  .promo p{margin:0 0 14px;font-size:13.5px;opacity:.95}
  .promo a{display:inline-block;text-decoration:none;font-weight:800;font-size:14px;background:#fff;padding:10px 16px;border-radius:10px}
  .promo.fashion a{color:#9d174d}
  .promo.organic a{color:#065f46}

  /* ad */
  .ad-slot{margin:20px 0}
  .ad-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#9ca3af;text-align:center;margin-bottom:5px}
  .ad-ph{border:1.5px dashed #cbd5e1;border-radius:14px;background:repeating-linear-gradient(45deg,#fbfdfe,#fbfdfe 12px,#f3f7f9 12px,#f3f7f9 24px);
    color:#94a3b8;display:grid;place-items:center;text-align:center;padding:20px;font-size:13px;min-height:96px}
  .ad-ph b{color:#64748b}

  /* tab bar */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar button{
    flex:1;background:none;border:0;padding:11px 6px 12px;font-family:inherit;font-size:11.5px;font-weight:700;
    color:#94a3b8;display:grid;gap:3px;justify-items:center;cursor:pointer;
  }
  .tabbar button.active{color:var(--brand)}
  .tabbar svg{width:22px;height:22px}

  .hidden{display:none !important}
  .toast{
    position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111827;color:#fff;
    padding:11px 16px;border-radius:12px;font-size:13.5px;z-index:60;opacity:0;transition:.25s;pointer-events:none;
    max-width:88vw;text-align:center;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>

<header class="appbar">
  <div class="wrap">
    <div class="logo">
      <img src="icon-192.png" alt="">
      <span>HSK Parcel Tracker<span class="sub">Hrudai Store Kart</span></span>
    </div>
    <button class="install-btn" id="installBtn" hidden>Install</button>
  </div>
</header>

<main class="wrap">

  <!-- ===== TAB: parcels ===== -->
  <section id="tab-parcels">
    <div class="search">
      <h1>Track a parcel</h1>
      <p>Add any tracking number. We detect the courier for you.</p>
      <form class="field" id="addForm" autocomplete="off">
        <input id="numInput" type="text" inputmode="text" placeholder="Enter tracking number" aria-label="Tracking number">
        <select id="courierSelect" aria-label="Courier"></select>
        <button class="btn" type="submit">Track</button>
      </form>
      <p class="note" id="detectNote"></p>
    </div>

    <div class="sec"><h2>My parcels</h2><span class="pill" id="countPill"></span></div>
    <div class="cards" id="list"></div>

    <div class="ad-slot">
      <div class="ad-label">Advertisement</div>
      <div id="ad-top"></div>
    </div>
  </section>

  <!-- ===== TAB: shop ===== -->
  <section id="tab-shop" class="hidden">
    <div class="sec"><h2>Our stores</h2></div>
    <div id="promos"></div>
    <div class="ad-slot">
      <div class="ad-label">Advertisement</div>
      <div id="ad-bottom"></div>
    </div>
  </section>

  <!-- ===== view: detail ===== -->
  <section id="view-detail" class="hidden">
    <button class="back" id="backBtn">&#8592; Back</button>
    <div id="detail"></div>
  </section>

</main>

<nav class="tabbar">
  <button data-tab="parcels" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><path d="M3.27 6.96 12 12.01l8.73-5.05M12 22.08V12"></path></svg>
    Parcels
  </button>
  <button data-tab="shop">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><path d="M3 6h18M16 10a4 4 0 0 1-8 0"></path></svg>
    Shop
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* ============================ CONFIG ============================ */
const CONFIG = {
  dataFile: "tracking_data.json",   // published parcel list from track_parcels.py

  // ---- LIVE STATUS (optional) ----
  // Paste the URL of your live-status endpoint here. Either works:
  //   Cloudflare Worker:  "https://hsk-track.<you>.workers.dev"
  //   Firebase Function:  "https://asia-south1-<project>.cloudfunctions.net/track"
  // When set, the app fetches real live status for ANY number.
  liveApi: "https://asia-south1-hsk-tracker-1a2b3.cloudfunctions.net/track",

  // ---- GOOGLE ADSENSE ----
  // Paste your AdSense publisher ID (ca-pub-...). Auto ads start working with
  // just this. Slot IDs are optional - add them for fixed, hand-placed units.
  adSenseClient: "ca-pub-XXXXXXXXXXXXXXXX",
  adSlots: { top: "", bottom: "" },

  stores: [
    { cls:"fashion", tag:"Fashion & Accessories", name:"Hrudai Store",
      desc:"Premium clothing, jewellery and accessories - trendy picks and more.",
      url:"https://hsk2020.in", cta:"Shop hsk2020.in" },
    { cls:"organic", tag:"Organic Products", name:"HSK Organic",
      desc:"Premium organic products delivered to your door.",
      url:"https://hsk.co.in", cta:"Shop hsk.co.in" }
  ]
};

/* ==================== courier detection (best effort) ==================== */
const CARRIERS = [
  { name:"Amazon",                  re:/^TBA\d{10,}$/i,
    url:"https://www.amazon.in/progress-tracker" },
  { name:"Shadowfax",               re:/^SF\d{8,}$/i,
    url:"" },
  { name:"UPS",                     re:/^(1Z[0-9A-Z]{16}|T\d{10})$/i,
    url:"https://www.ups.com/track?loc=en_US&tracknum={tn}" },
  { name:"India Post / Speed Post", re:/^[A-Z]{2}\d{9}[A-Z]{2}$/i,
    url:"https://www.indiapost.gov.in/_layouts/15/dop.portal.tracking/trackconsignment.aspx" },
  { name:"Delhivery",               re:/^\d{11,14}$/,
    url:"https://www.delhivery.com/track/package/{tn}" },
  { name:"Ekart",                   re:/^[A-Z]{2}\d{9,}$/i,
    url:"https://ekartlogistics.com/track/{tn}" },
  { name:"DTDC",                    re:/^[A-Z]\d{8,10}$/i,
    url:"https://www.dtdc.in/tracking/tracking_results.asp" },
  { name:"Blue Dart",               re:/^\d{10,11}$/,
    url:"https://www.bluedart.com/tracking" },
  { name:"XpressBees",              re:/^[A-Z0-9]{10,16}$/i,
    url:"https://www.xpressbees.com/track?awb={tn}" }
];
function detectCarrier(num){
  const n=(num||"").trim();
  if(!n) return null;
  for(const c of CARRIERS){ if(c.re.test(n)) return c; }
  return null;
}
function courierUrl(name, num){
  const c=CARRIERS.find(x=>x.name===name);
  if(c && c.url) return c.url.includes("{tn}") ? c.url.replace("{tn}", encodeURIComponent(num)) : c.url;
  // No known tracking URL for this courier - fall back to a search so there's always a way through.
  return "https://www.google.com/search?q=" + encodeURIComponent((name?name+" ":"") + "track " + num);
}

/* ============================ state ============================ */
const STORE_KEY="hsk_tracked_v1";
let PUBLISHED={parcels:[]};
let saved=[];              // array of parcel objects

function loadSaved(){ try{ saved=JSON.parse(localStorage.getItem(STORE_KEY)||"[]"); }catch(e){ saved=[]; } }
function persist(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(saved)); }catch(e){} }

function statusClass(p){
  if(p.error) return "err";
  const s=(p.status||"").toLowerCase();
  if(p.delivered==="YES"||(s.includes("deliver")&&!s.includes("out for"))) return "ok";
  if(s.includes("out for")) return "info";
  if(s.includes("transit")||s.includes("picked")||s.includes("arriv")||s.includes("manifest")) return "warn";
  return "mute";
}
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }

/* ============================ data load ============================ */
async function loadPublished(){
  try{
    const r=await fetch(CONFIG.dataFile,{cache:"no-store"});
    if(r.ok){ const j=await r.json(); if(j&&Array.isArray(j.parcels)) PUBLISHED=j; }
  }catch(e){}
}

/* ============================ tracking ============================ */
async function lookupLive(num){
  if(!CONFIG.liveApi) return null;
  try{
    const url=new URL(CONFIG.liveApi);
    url.searchParams.set("tracking_number", num);
    const r=await fetch(url.toString(),{cache:"no-store"});
    if(!r.ok) return null;
    const j=await r.json();
    if(j && (j.status||j.courier)) return {
      number:num, courier:j.courier||"", status:j.status||"", delivered:j.delivered?"YES":"",
      lastLocation:j.last_location||"", lastUpdate:j.last_update||"",
      trackUrl:j.track_url||"", events:j.events||[], source:"live"
    };
  }catch(e){}
  return null;
}

async function trackNumber(numRaw, courierOverride){
  const num=(numRaw||"").trim().toUpperCase();
  if(!num){ toast("Enter a tracking number"); return; }

  const det = courierOverride && courierOverride!=="Auto-detect"
      ? CARRIERS.find(c=>c.name===courierOverride)
      : detectCarrier(num);

  // 1) published list
  const pub = PUBLISHED.parcels.find(p=>(p.tracking_number||"").toUpperCase()===num);
  let parcel;
  if(pub){
    parcel={ number:num, courier:pub.courier||(det&&det.name)||"", status:pub.status||"",
      delivered:pub.delivered||"", lastLocation:pub.last_location||"", lastUpdate:pub.last_update||"",
      trackUrl:pub.track_url||courierUrl((det&&det.name)||pub.courier,num), events:pub.events||[], source:"published" };
  } else {
    // 2) live API (if configured)
    const live = await lookupLive(num);
    if(live){
      parcel=live;
      if(!parcel.courier && det) parcel.courier=det.name;
    } else {
      // 3) manual hand-off
      parcel={ number:num, courier:(det&&det.name)||"", status:"Not tracked yet",
        delivered:"", lastLocation:"", lastUpdate:"",
        trackUrl:courierUrl((det&&det.name)||"",num), events:[], source:"manual" };
    }
  }
  parcel.addedAt=Date.now();
  const i=saved.findIndex(p=>p.number===num);
  if(i>=0) saved[i]=parcel; else saved.unshift(parcel);
  persist(); renderList(); showDetail(num);
  if(parcel.source==="manual") toast("Added - tap Track on courier site for live status");
}

/* ============================ render ============================ */
function renderList(){
  const el=document.getElementById("list");
  document.getElementById("countPill").textContent = saved.length ? saved.length+" saved" : "";
  if(!saved.length){
    el.innerHTML=`<div class="empty"><b>No parcels yet.</b><br>Add a tracking number above to start.</div>`;
    return;
  }
  el.innerHTML=saved.map(p=>{
    const cls=statusClass(p);
    const st=p.error?"Unavailable":(p.status||"Added");
    return `<div class="card" data-num="${esc(p.number)}">
      <div class="left">
        <div class="num">${esc(p.number)}</div>
        <div class="meta">${esc(p.courier||"Courier not detected")}${p.lastUpdate?" &middot; "+esc(p.lastUpdate):""}</div>
      </div>
      <span class="badge ${cls}"><span class="dot"></span>${esc(st)}</span>
      <span class="chev">&#8250;</span>
    </div>`;
  }).join("");
}

function showDetail(num){
  const p=saved.find(x=>x.number===num);
  if(!p) return;
  const cls=statusClass(p);
  const st=p.error?"Status unavailable":(p.status||"Added");
  const events=(p.events||[]).slice().reverse();
  document.getElementById("detail").innerHTML=`
    <div class="hero">
      <div class="top">
        <div style="flex:1;min-width:0">
          <div class="num">${esc(p.number)}</div>
          <div class="cour">${esc(p.courier||"Courier not detected")}</div>
        </div>
        <span class="badge ${cls}"><span class="dot"></span>${esc(st)}</span>
      </div>
      ${p.lastUpdate?`<div class="upd">Updated ${esc(p.lastUpdate)}${p.lastLocation?" &middot; "+esc(p.lastLocation):""}</div>`:""}
      <div class="actions">
        ${p.trackUrl?`<a href="${esc(p.trackUrl)}" target="_blank" rel="noopener">Track on courier site</a>`:""}
        <button id="shareBtn">Share</button>
        <button class="danger" id="removeBtn">Remove</button>
      </div>
    </div>
    ${events.length?`<div class="timeline">${events.map(e=>`
      <div class="tl"><div class="dot2"></div><div>
        <div class="act">${esc(e.activity||"-")}</div>
        <div class="sub">${esc(e.date||"")}${e.location?" &middot; "+esc(e.location):""}</div>
      </div></div>`).join("")}</div>`
    :`<div class="timeline"><div class="tl"><div class="dot2"></div><div>
        <div class="act">${esc(p.status||"Added")}</div>
        <div class="sub">${p.source==="manual"?"Open the courier site for the live scan history.":"No scan events yet."}</div>
      </div></div></div>`}
  `;
  document.getElementById("tab-parcels").classList.add("hidden");
  document.getElementById("tab-shop").classList.add("hidden");
  document.getElementById("view-detail").classList.remove("hidden");
  document.querySelectorAll(".tabbar button").forEach(b=>b.classList.remove("active"));

  document.getElementById("backBtn").onclick=()=>{ showTab("parcels"); };
  const rb=document.getElementById("removeBtn");
  if(rb) rb.onclick=()=>{ saved=saved.filter(x=>x.number!==num); persist(); renderList(); showTab("parcels"); toast("Removed"); };
  const sb=document.getElementById("shareBtn");
  if(sb) sb.onclick=async()=>{
    const url=location.origin+location.pathname;
    const text=`Track parcel ${p.number}${p.status?" - "+p.status:""}`;
    if(navigator.share){ try{ await navigator.share({title:"Parcel "+p.number,text,url}); }catch(e){} }
    else { try{ await navigator.clipboard.writeText(text+" "+url); toast("Copied to clipboard"); }catch(e){ toast(text); } }
  };
  window.scrollTo({top:0});
}

function showTab(name){
  document.getElementById("view-detail").classList.add("hidden");
  document.getElementById("tab-parcels").classList.toggle("hidden", name!=="parcels");
  document.getElementById("tab-shop").classList.toggle("hidden", name!=="shop");
  document.querySelectorAll(".tabbar button").forEach(b=>b.classList.toggle("active", b.dataset.tab===name));
  window.scrollTo({top:0});
}

/* ============================ promos + ads ============================ */
function renderPromos(){
  document.getElementById("promos").innerHTML=CONFIG.stores.map(s=>`
    <div class="promo ${s.cls}">
      <span class="tag">${esc(s.tag)}</span>
      <h3>${esc(s.name)}</h3>
      <p>${esc(s.desc)}</p>
      <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.cta)} &rarr;</a>
    </div>`).join("");
}
function adsConfigured(){
  const c = CONFIG.adSenseClient || "";
  return c.startsWith("ca-pub-") && !c.includes("XXXX");
}
function renderAds(){
  const configured = adsConfigured();
  const slots = CONFIG.adSlots || {};

  const place = (el, slot) => {
    if (!el) return;
    if (!configured){
      el.innerHTML = `<div class="ad-ph"><div><b>Google AdSense</b><br>Add your publisher ID in CONFIG to show ads.</div></div>`;
    } else if (slot){
      el.innerHTML = `<ins class="adsbygoogle" style="display:block"
        data-ad-client="${esc(CONFIG.adSenseClient)}" data-ad-slot="${esc(slot)}"
        data-ad-format="auto" data-full-width-responsive="true"></ins>`;
    } else {
      el.innerHTML = "";   // Auto ads will place ads automatically
    }
  };
  place(document.getElementById("ad-top"), slots.top);
  place(document.getElementById("ad-bottom"), slots.bottom);

  if (!configured) return;

  // One AdSense loader powers BOTH Auto ads and the manual slots above.
  if (!document.querySelector("script[data-adsense]")){
    const m = document.createElement("meta");
    m.name = "google-adsense-account";
    m.content = CONFIG.adSenseClient;
    document.head.appendChild(m);

    const s = document.createElement("script");
    s.async = true;
    s.setAttribute("data-adsense", "1");
    s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" + encodeURIComponent(CONFIG.adSenseClient);
    s.crossOrigin = "anonymous";
    document.head.appendChild(s);
    s.onload = () => {
      document.querySelectorAll("ins.adsbygoogle").forEach(() => {
        try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
      });
    };
  }
}

/* ============================ courier select ============================ */
function fillCourierSelect(){
  const sel=document.getElementById("courierSelect");
  sel.innerHTML=`<option>Auto-detect</option>`+CARRIERS.map(c=>`<option>${esc(c.name)}</option>`).join("");
}

/* ============================ boot ============================ */
async function boot(){
  loadSaved(); fillCourierSelect(); renderPromos(); renderAds();
  await loadPublished();
  renderList();

  const numInput=document.getElementById("numInput");
  numInput.addEventListener("input",()=>{
    const d=detectCarrier(numInput.value);
    const note=document.getElementById("detectNote");
    if(numInput.value.trim() && d){ note.className="note"; note.textContent="Detected courier: "+d.name+" (best guess - change it if wrong)."; }
    else if(numInput.value.trim()){ note.className="note warn"; note.textContent="Courier not recognised - pick one, or leave as Auto-detect."; }
    else { note.textContent=""; }
  });

  document.getElementById("addForm").addEventListener("submit",e=>{
    e.preventDefault();
    trackNumber(numInput.value, document.getElementById("courierSelect").value).then(()=>{ numInput.value=""; document.getElementById("detectNote").textContent=""; });
  });

  document.getElementById("list").addEventListener("click",e=>{
    const c=e.target.closest(".card[data-num]"); if(!c) return;
    showDetail(c.getAttribute("data-num"));
  });

  document.querySelectorAll(".tabbar button").forEach(b=>{
    b.addEventListener("click",()=>showTab(b.dataset.tab));
  });

  // PWA install prompt
  let deferred=null;
  window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferred=e; document.getElementById("installBtn").hidden=false; });
  document.getElementById("installBtn").addEventListener("click",async()=>{
    if(!deferred){ toast("Use your browser menu > Add to Home screen"); return; }
    deferred.prompt(); await deferred.userChoice; deferred=null; document.getElementById("installBtn").hidden=true;
  });

  // service worker
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
}
boot();
</script>
